# ============================================================
# 凌瑶智数 · 生产 Nginx 反代 + sub_filter 配置模板
# V2.0.77.24 · 2026-09-13
#
# 用途：prod / staging 环境把 dev 默认值
#   <meta name="api-base" content="http://localhost:9091">
# 替换为
#   <meta name="api-base" content="">
# 让前端 JS 走同源 /api 相对路径（不再跨域直连 9091）
#
# 部署位置：/etc/nginx/conf.d/lingyao.conf（或主站 server block 内）
# 关联文档：infra/port-allocation.md + infra/port-change-checklist.md §3.2
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name lydmed.com www.lydmed.com;     # 改实际域名

    # ── HTTPS 重定向（启用 HTTPS 后取消注释）────
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lydmed.com www.lydmed.com;

    ssl_certificate     /etc/letsencrypt/live/lydmed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lydmed.com/privkey.pem;

    # ── 静态资源直接由 Nginx 服务（HTML / CSS / JS / 图片）────
    root /opt/lingyao/backend/target/classes/static;   # jar 解压后路径
    index index.html;

    # ── 反向代理到 Spring Boot 9091（含 sub_filter）────
    location / {
        # V2.0.77.24：把 dev 默认值替换成空（同源反代走 /api）
        sub_filter '<meta name="api-base" content="http://localhost:9091">'
                   '<meta name="api-base" content="">';
        sub_filter_types text/html;
        sub_filter_once off;       # 允许同一响应里有多个匹配（多 HTML 文件）
        sub_filter_last_modified on;

        # V2.0.77.24b（未来扩展）：如果上线 oauth-callback-base / subtask-* base meta
        # 也在这里追加 sub_filter 规则即可，无需改 HTML
        # sub_filter '<meta name="oauth-callback-base" content="http://localhost:9091">'
        #            '<meta name="oauth-callback-base" content="">';

        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 静态资源缓存（HTML 不缓存，其他长期缓存）────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── 健康检查端点（不走 sub_filter）────
    location = /api/_diag/version {
        proxy_pass http://127.0.0.1:9091;
        access_log off;
    }

    # ── 安全头（与 backend SecurityHeadersFilter 同步）────
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
}

# ============================================================
# Staging 环境差异（仅 server_name + 证书路径不同）
# 完整 stage 配置不在本文件，复制 server block 改：
#   - server_name staging.lydmed.com
#   - ssl_certificate /etc/letsencrypt/live/staging.lydmed.com/...
#   - root 路径（staging jar 解压目录）
# sub_filter 规则完全一致（dev 默认值在所有环境都生效）
# ============================================================
