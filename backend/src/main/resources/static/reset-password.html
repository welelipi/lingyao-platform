<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 · 凌瑶智数</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0A1F3D 0%, #16324F 55%, #3D5A80 100%);
      padding: 20px;
    }
    .card {
      background: #fff; border-radius: 12px; padding: 40px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(10,31,61,.35);
    }
    h1 { font-size: 22px; color: #0A1F3D; margin-bottom: 8px; text-align: center; }
    .hint { color: #64748b; font-size: 13px; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 15px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #3D5A80; }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #0A1F3D; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .error { color: #B23A2F; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
    .ok-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .back { display: block; text-align: center; margin-top: 18px; color: #3D5A80; font-size: 13px; text-decoration: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <!-- 表单视图 -->
    <div id="formView">
      <h1>重置密码</h1>
      <p class="hint">请设置新密码（重置链接 30 分钟内有效）</p>
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="至少 8 位">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="再次输入">
        </div>
        <button type="submit" class="btn" id="resetBtn">确认重置</button>
        <div class="error" id="errMsg"></div>
      </form>
    </div>
    <!-- 成功视图 -->
    <div id="okView" class="hidden">
      <div class="ok-icon">✅</div>
      <h1>密码已重置</h1>
      <p class="hint">请使用新密码重新登录</p>
      <a class="btn" id="gotoLogin" href="portal.html" style="display:block;text-align:center;text-decoration:none;">前往登录</a>
    </div>
    <!-- 无效 token 视图 -->
    <div id="badView" class="hidden">
      <div class="ok-icon">⚠️</div>
      <h1>链接无效</h1>
      <p class="hint" id="badReason">重置链接无效或已过期，请重新发起「忘记密码」。</p>
      <a class="back" href="portal.html">返回登录页</a>
    </div>
  </div>

  <script>
    // 同目录静态 API（与 portal.html 一致；staging 子路径部署时本页与 portal 同目录，相对路径即可）
    const API_BASE = '';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    if (!token) {
      document.getElementById('formView').classList.add('hidden');
      document.getElementById('badView').classList.remove('hidden');
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errMsg');
      const btn = document.getElementById('resetBtn');
      err.textContent = '';
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) { err.textContent = '两次输入的新密码不一致'; return; }
      if (newPassword.length < 8) { err.textContent = '新密码长度至少 8 位'; return; }
      btn.disabled = true; btn.textContent = '提交中...';
      try {
        const res = await fetch(API_BASE + '/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.code === 0) {
          document.getElementById('formView').classList.add('hidden');
          document.getElementById('okView').classList.remove('hidden');
        } else {
          err.textContent = data.message || ('重置失败（HTTP ' + res.status + '）');
          btn.disabled = false; btn.textContent = '确认重置';
        }
      } catch (e2) {
        err.textContent = '网络错误：' + e2.message;
        btn.disabled = false; btn.textContent = '确认重置';
      }
    });
  </script>
</body>
</html>
