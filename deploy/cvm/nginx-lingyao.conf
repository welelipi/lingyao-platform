# 凌瑶智数 · Nginx 反向代理配置（腾讯云 CVM 私有化部署）
# 用途：把 80/443 端口的 HTTP/HTTPS 请求转发到本地 9091 Spring Boot
# 适用阶段：ICP 备案通过前（公网 IP 直连）+ 备案通过后（切域名都改这一行 server_name）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;  # 临时通配，备案通过后改成 www.lydmed.com lydmed.com

    client_max_body_size 50M;        # 凌瑶上传医院床位数等参数文件需要
    proxy_read_timeout 60s;

    # 访问日志 + 错误日志（便于排查 502/504）
    access_log /var/log/nginx/lingyao.access.log;
    error_log  /var/log/nginx/lingyao.error.log;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # H2 Console 暴露路径（开发者用，生产可不暴露但不影响功能）
    location /h2-console {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
    }
}